[project]
name = "vault-rag-mcp"
version = "0.1.0"
description = "MCP server for semantic search in an Obsidian vault via Supabase pgvector + OpenRouter embeddings"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "supabase>=2.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
vault-rag-mcp = "vault_rag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_rag_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/vault_rag_mcp"]
