name: Security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "30 6 * * 1"  # Mondays, catch newly-disclosed CVEs while the repo is quiet
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: fjacquet/ci/.github/workflows/python-security.yml@v1
    with: { python-version: "3.12" }
